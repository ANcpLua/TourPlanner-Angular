coverage:
  status:
    project:
      angular:
        flags:
          - angular
        target: 95%
      dotnet:
        flags:
          - dotnet
        target: 90%
    patch:
      default:
        target: auto

flags:
  angular:
    paths:
      - frontend/src/app/
    carryforward: true
  dotnet:
    paths:
      - backend/API/
      - backend/BL/
      - backend/DAL/
      - backend/Contracts/
    carryforward: true

fixes:
  - "src/app/::frontend/src/app/"
  - "API/::backend/API/"
  - "BL/::backend/BL/"
  - "DAL/::backend/DAL/"
  - "Contracts/::backend/Contracts/"

ignore:
  - "frontend/src/app/app.config.ts"
  - "frontend/src/app/app.routes.ts"
  - "frontend/src/app/core/api/generated/**"
  - "frontend/src/app/**/models/**"
  - "frontend/src/app/features/tours/components/tour-map.component.ts"
