name: Tests and Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  angular-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run Angular tests with coverage
        working-directory: ./frontend
        run: >-
          npx ng test --coverage
          --coverage-reporters=cobertura
          --coverage-reporters=text-summary
          --coverage-include='src/app/**/*.ts'
          --coverage-exclude='src/app/app.config.ts'
          --coverage-exclude='src/app/app.routes.ts'
          --coverage-exclude='src/app/core/api/generated/**'
          --coverage-exclude='src/app/**/models/**'
          --coverage-exclude='src/app/features/tours/components/tour-map.component.ts'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/coverage/cobertura-coverage.xml
          flags: angular
          fail_ci_if_error: true

  dotnet-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18@sha256:8be8bfcb33f4e7f38fe8e188c7923309ca7503a4871ecef67bcd7f3b358b0bb4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tourplanner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tourplanner_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ConnectionStrings__TourPlannerDatabase: Host=127.0.0.1;Port=5432;Database=tourplanner_test;Username=postgres;Password=postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2

      - name: Setup .NET 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: ./backend
        run: dotnet restore SWEN2.TourPlanner.Angular.slnx

      - name: Build
        working-directory: ./backend
        run: dotnet build SWEN2.TourPlanner.Angular.slnx --no-restore --configuration Release

      - name: Install libgdiplus for System.Drawing on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdiplus

      - name: Run tests with coverage (MTP + coverlet)
        working-directory: ./backend
        run: |
          ./Tests/bin/Release/net10.0/Tests \
            --coverlet --coverlet-output-format cobertura \
            --coverlet-exclude-by-file "**/Program.cs" \
            --coverlet-exclude-by-file "**/*.g.cs" \
            --coverlet-exclude-by-file "**/*.g.i.cs" \
            --coverlet-exclude-by-file "**/*.designer.cs" \
            --coverlet-exclude-by-file "**/*.Generated.cs" \
            --coverlet-exclude "[*]*.Migrations.*" \
            --coverlet-exclude-by-attribute ExcludeFromCodeCoverage \
            --coverlet-exclude-by-attribute GeneratedCodeAttribute \
            --coverlet-exclude-by-attribute CompilerGeneratedAttribute \
            --results-directory TestResults

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/TestResults/coverage.cobertura.xml
          flags: dotnet
          fail_ci_if_error: true
